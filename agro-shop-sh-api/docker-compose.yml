services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agro-shop-sh-api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3002 
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_MIGRATIONS_RUN: 'false'
    ports:
      - '3002:3002'
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: agro-shop-sh-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-my-secret-pwd}
      MYSQL_DATABASE: ${DATABASE_NAME:-agro-shop-sh}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - '3307:3306'
    restart: unless-stopped
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: